<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Villa 南千歳">
  <!-- ロゴのステンドグラスのアーチを、16pxでも読めるよう大きめのタイルで簡略化したマーク -->
